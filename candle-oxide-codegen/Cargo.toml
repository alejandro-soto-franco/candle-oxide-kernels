[package]
name = "candle-oxide-codegen"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
description = "Builds Candle's elementwise CUDA kernels through the cuda-oxide standalone PTX API"

# Pinned to NVIDIA/cuda-rust rev 9df9e7cef561e03a066230b3bb433b3d8285da81,
# the first rev with cuda-oxide on stable Rust 1.99.1. `pliron` is pinned to
# the exact release cuda-oxide uses because pliron types (`Context`,
# `Ptr<BasicBlock>`, `TypeHandle`, `Value`) cross the API boundary into
# `cuda_oxide_codegen::experimental`, and a second copy resolves as a
# distinct, incompatible crate.
[dependencies]
cuda-oxide-codegen = { git = "https://github.com/NVIDIA/cuda-rust", rev = "9df9e7cef561e03a066230b3bb433b3d8285da81" }
dialect-mir = { git = "https://github.com/NVIDIA/cuda-rust", rev = "9df9e7cef561e03a066230b3bb433b3d8285da81" }
dialect-nvvm = { git = "https://github.com/NVIDIA/cuda-rust", rev = "9df9e7cef561e03a066230b3bb433b3d8285da81" }
pliron = "=0.20.0"
