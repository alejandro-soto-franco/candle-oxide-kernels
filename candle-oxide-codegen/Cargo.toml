[package]
name = "candle-oxide-codegen"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
description = "Builds Candle's elementwise CUDA kernels through the cuda-oxide standalone PTX API"

# Pinned to cuda-oxide rev 0810ba95ff9dcf1ca379b779d3ebe33a8899b15d, resolved
# as git dependencies (this form worked against `cargo fetch`). `pliron` is
# pinned to cuda-oxide's own git rev (not a registry version) because
# pliron types (`Context`, `Ptr<BasicBlock>`, `TypeHandle`, `Value`) cross
# the API boundary into `cuda_oxide_codegen::experimental`; a registry copy
# resolves as a distinct, incompatible crate from cuda-oxide's git copy even
# at the same version number.
[dependencies]
cuda-oxide-codegen = { git = "https://github.com/NVlabs/cuda-oxide", rev = "0810ba95ff9dcf1ca379b779d3ebe33a8899b15d" }
dialect-mir = { git = "https://github.com/NVlabs/cuda-oxide", rev = "0810ba95ff9dcf1ca379b779d3ebe33a8899b15d" }
dialect-nvvm = { git = "https://github.com/NVlabs/cuda-oxide", rev = "0810ba95ff9dcf1ca379b779d3ebe33a8899b15d" }
pliron = { git = "https://github.com/pliron-org/pliron", rev = "0d3f25df6d0e76b6c6f23d6e17172142b50c715c" }
